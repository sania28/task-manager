spring.application.name=task-manager-backend
server.port=${PORT:8080}

# MongoDB - set MONGODB_URI env var in production (e.g. MongoDB Atlas connection string)
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/taskmanager}

# JWT - set JWT_SECRET env var in production to a long random string
app.jwt.secret=${JWT_SECRET:ChangeThisToALongRandomSecretKeyForJwtSigningAtLeast256BitsLong}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS - set ALLOWED_ORIGINS env var to your deployed frontend URL (comma-separated for multiple)
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173}

logging.level.org.springframework.security=INFO
